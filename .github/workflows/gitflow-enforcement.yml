name: GitFlow Enforcement

on:
  push:
    branches: [ main, develop, 'feature/*', 'release/*', 'hotfix/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  gitflow-validation:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Validate GitFlow Rules
      run: |
        echo "🔍 Validating GitFlow branch rules..."
        
        # Get current branch
        BRANCH_NAME=${GITHUB_REF#refs/heads/}
        
        # Validate branch naming
        if [[ $BRANCH_NAME == main ]]; then
          echo "✅ Main branch - only accepts merges from develop or hotfix branches"
        elif [[ $BRANCH_NAME == develop ]]; then
          echo "✅ Develop branch - accepts merges from feature branches"
        elif [[ $BRANCH_NAME == feature/* ]]; then
          echo "✅ Feature branch - must be merged into develop"
        elif [[ $BRANCH_NAME == release/* ]]; then
          echo "✅ Release branch - must be merged into main and develop"
        elif [[ $BRANCH_NAME == hotfix/* ]]; then
          echo "✅ Hotfix branch - must be merged into main and develop"
        else
          echo "❌ Invalid branch name: $BRANCH_NAME"
          echo "Valid patterns: main, develop, feature/*, release/*, hotfix/*"
          exit 1
        fi
        
        # Validate commit messages
        echo "🔍 Validating commit messages..."
        if ! git log --oneline -1 | grep -E '^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: .{1,50}'; then
          echo "❌ Invalid commit message format"
          echo "Use: type(scope): description"
          echo "Types: feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert"
          exit 1
        fi
        
        echo "✅ GitFlow validation passed!"

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Security Scan
      run: |
        echo "🔒 Running security scan..."
        
        # Check for secrets in code
        if grep -r -i "password\|secret\|key\|token" --include="*.py" --include="*.yml" --include="*.yaml" . | grep -v ".github/workflows" | grep -v ".gitignore"; then
          echo "❌ Potential secrets found in code!"
          exit 1
        fi
        
        # Check for sensitive files
        if [ -f ".env" ] || [ -f "secret_key.txt" ] || [ -f "*.pem" ]; then
          echo "❌ Sensitive files found in repository!"
          exit 1
        fi
        
        echo "✅ Security scan passed!"

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check code formatting with black
      run: |
        black --check --diff .
    
    - name: Check import sorting with isort
      run: |
        isort --check-only --diff .

  docker-build-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t kapiga-research-test .
    
    - name: Test Docker Compose
      run: |
        docker-compose config
